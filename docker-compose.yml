services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: presentation-manager-keycloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8090}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: start-dev
    networks:
      - presentation-manager-network

  mysql:
    image: mysql:8.4
    container_name: presentation-manager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-my0password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-presentation_manager}
      MYSQL_USER: ${MYSQL_USER:-dbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-passw0rd}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - presentation-manager-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    image: presentation-manager-backend
    container_name: presentation-manager-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-presentation_manager}
      DB_USER: ${MYSQL_USER:-dbuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-passw0rd}
      OIDC_REALM_URL: ${OIDC_REALM_URL:-http://keycloak:8080/realms/presentation-manager}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-nextjs-front}
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - presentation-manager-network

  ui:
    build:
      context: ./ui
      dockerfile: ../docker/ui/Dockerfile
    image: presentation-manager-ui
    container_name: presentation-manager-ui
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - presentation-manager-network

volumes:
  mysql_data:
  keycloak_data:

networks:
  presentation-manager-network:
    driver: bridge
