services:
  mysql:
    image: mysql:8.0
    container_name: presentation-manager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - presentation-manager-network

  backend:
    build:
      context: ./backend
      dockerfile: ./docker/backend/Dockerfile
    container_name: presentation-manager-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - presentation-manager-network

  ui:
    build:
      context: ./ui
      dockerfile: ./docker/ui/Dockerfile
    container_name: presentation-manager-ui
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - presentation-manager-network

volumes:
  mysql_data:

networks:
  presentation-manager-network:
    driver: bridge 